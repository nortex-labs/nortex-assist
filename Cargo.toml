[package]
name = "nortex-assist"
version = "1.2.0"
edition = "2021"
description = "Hotkey AI assistant overlay (Rust + Slint port)"

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
global-hotkey = "0.9"
tray-icon = { version = "0.26", default-features = false }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.52"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
